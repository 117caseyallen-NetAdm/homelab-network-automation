all:
  vars:
    ansible_connection: ansible.netcommon.network_cli
    ansible_user: casey
  children:
    ios:
      vars:
        ansible_network_os: cisco.ios.ios
      hosts:
        3560CG-1: { ansible_host: 10.99.10.1 }
        3560CG-2: { ansible_host: 10.99.20.1 }
        C2940-LAB: { ansible_host: 10.99.20.20 }
    eos:
      vars:
        ansible_network_os: arista.eos.eos
      hosts:
        ARISTA710P-LAB: { ansible_host: 10.99.10.14 }
    junos:
      vars:
        ansible_network_os: junipernetworks.junos.junos
        ansible_connection: ansible.netcommon.netconf
        ansible_port: 22
      hosts:
        SRX345-LAB: { ansible_host: 10.99.0.2 }

[defaults]
inventory             = ./inventory/hosts.yml
host_key_checking     = False
interpreter_python    = /opt/ansible/bin/python3
# On deliberately. It was False, and that hid the deprecation of the Junos
# collection along with its removal date - see docs/findings.md #13.
deprecation_warnings  = True

[persistent_connection]
connect_timeout = 60
command_timeout = 60

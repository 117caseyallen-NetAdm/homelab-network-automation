---
# no_log: the running config carries hashed local passwords and the TACACS+
# shared key. It is held in memory, matched against, and discarded.
#
# But no_log censors FAILURES too, which makes a broken task undiagnosable.
# So it is a switch, defaulting to on:
#     ansible-playbook ... -e debug_config=true
# turns it off for one run. That prints secrets to your terminal. Interactive
# use only, never in CI.

- name: IOS / EOS - read the running configuration
  ansible.netcommon.cli_command:
    command: show running-config
  register: cli_raw
  when: platform in ['ios', 'eos']
  no_log: "{{ not (debug_config | default(false) | bool) }}"

# juniper.device is the canonical home of the Junos modules. The
# junipernetworks.junos names are deprecated redirects to it, removed after
# 2028-04-01 - a deadline that deprecation_warnings = False had been hiding.
- name: Junos - read the configuration in set format
  juniper.device.junos_command:
    commands: show configuration
    display: set
  register: junos_raw
  when: platform == 'junos'
  no_log: "{{ not (debug_config | default(false) | bool) }}"

- name: Hold the configuration in one variable whatever the platform
  ansible.builtin.set_fact:
    cfg: "{{ junos_raw.stdout[0] if platform == 'junos' else cli_raw.stdout }}"
  no_log: "{{ not (debug_config | default(false) | bool) }}"
